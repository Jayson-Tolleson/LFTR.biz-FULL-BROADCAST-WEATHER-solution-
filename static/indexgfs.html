<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GFS v7</title>
  <style>
    :root {
      --bg: #060c18;
      --glass: rgba(12, 22, 43, 0.72);
      --line: rgba(96, 165, 250, 0.35);
      --cyan: #22d3ee;
      --pink: #f472b6;
      --lime: #84cc16;
      --amber: #f59e0b;
      --text: #e6f4ff;
    }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: radial-gradient(circle at 18% 10%, #1d4ed8 0%, #08122a 44%, #04070f 100%);
      color: var(--text);
    }
    .wrap { padding: 12px; display: grid; gap: 12px; }
    .card {
      border: 1px solid var(--line);
      background: var(--glass);
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 28px rgba(34, 211, 238, 0.08);
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .top { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
    .marker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .marker-content {
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(30,58,138,.25), rgba(15,23,42,.25));
      transition: transform .12s ease, border-color .12s ease;
    }
    .marker-content:hover { transform: translateY(-1px); border-color: var(--cyan); }
    .marker-name { font-weight: 700; font-size: 13px; }
    .marker-coord { font-size: 12px; opacity: 0.82; }
    .marker-bait { font-size: 12px; margin-top: 4px; }

    .features { display: flex; flex-wrap: wrap; gap: 8px; }
    .feature {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.55);
      color: #dbeafe;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .light {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #334155;
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    .feature.on .light { animation: bl 1.1s linear infinite; }
    .feature[data-kind="clouds"].on .light { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .feature[data-kind="rain"].on .light { background: #60a5fa; box-shadow: 0 0 10px #60a5fa; }
    .feature[data-kind="jet"].on .light { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
    .feature[data-kind="popups"].on .light { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
    .feature[data-kind="markers"].on .light { background: var(--lime); box-shadow: 0 0 10px var(--lime); }
    .feature[data-kind="bait"].on .light { background: #14b8a6; box-shadow: 0 0 10px #14b8a6; }
    .feature[data-kind="live"].on .light { background: #f43f5e; box-shadow: 0 0 10px #f43f5e; }
    .feature[data-kind="report"].on .light { background: #e879f9; box-shadow: 0 0 10px #e879f9; }
    @keyframes bl { 0%,100%{opacity:1} 50%{opacity:.28} }

    .hud {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: min(450px, calc(100% - 24px));
      background: rgba(9, 15, 31, 0.88);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      display: none;
      z-index: 999;
      backdrop-filter: blur(12px);
    }
    .hud.show { display: block; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    input, textarea, button {
      background: #0b1220;
      color: #e8eefc;
      border: 1px solid #334161;
      border-radius: 6px;
      padding: 6px;
    }
    textarea { width: 100%; min-height: 78px; }
    .videos a { color: #93c5fd; display: block; margin: 4px 0; }
    .status { font-size: 12px; opacity: 0.9; }
    .context { font-size: 12px; line-height: 1.45; border-top: 1px solid #27324a; padding-top: 8px; }
    @media (max-width: 980px) { .top { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="card">
      <strong>Fish markers</strong>
      <div id="markerGrid" class="marker-grid" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <strong>Feature lights</strong>
      <div id="features" class="features" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="card">
    <strong>GFS status</strong>
    <pre id="health" class="mono">loading...</pre>
  </div>
  <div class="card status" id="liveStatus">Live updates: connecting...</div>
</div>

<template id="markerTemplate">
  <marker-3d-interactive-element class="marker-host">
    <div class="marker-content">
      <div class="marker-name"></div>
      <div class="marker-coord"></div>
      <div class="marker-bait"></div>
    </div>
  </marker-3d-interactive-element>
</template>

<div id="popupHud" class="hud">
  <div class="row" style="justify-content:space-between;align-items:center">
    <strong id="hudTitle">Location</strong>
    <button id="closeHud">Close</button>
  </div>
  <div class="status" id="hudKey"></div>

  <div class="row">
    <button id="connectLiveBtn">Connect Live</button>
    <input id="liveUrl" placeholder="Live stream URL (optional)">
  </div>

  <div class="row">
    <input id="videoFile" type="file" accept="video/*">
    <button id="uploadBtn">Upload Video</button>
  </div>

  <div class="row">
    <textarea id="reportText" placeholder="Write fishing report for this location"></textarea>
    <button id="saveReportBtn">Save Report</button>
  </div>

  <div class="card" style="margin-top:8px">
    <strong>Location media</strong>
    <div id="mediaInfo" class="status">No media loaded yet.</div>
    <div id="videoList" class="videos"></div>
    <div id="intel" class="context"></div>
  </div>
</div>

<script>
(() => {
  const markerGrid = document.getElementById('markerGrid');
  const markerTemplate = document.getElementById('markerTemplate');
  const hud = document.getElementById('popupHud');
  const hudTitle = document.getElementById('hudTitle');
  const hudKey = document.getElementById('hudKey');
  const reportText = document.getElementById('reportText');
  const mediaInfo = document.getElementById('mediaInfo');
  const videoList = document.getElementById('videoList');
  const liveUrl = document.getElementById('liveUrl');
  const videoFile = document.getElementById('videoFile');
  const intel = document.getElementById('intel');

  const state = {
    fish: [],
    selected: null,
    features: {
      clouds: true,
      rain: true,
      jet: true,
      popups: true,
      markers: true,
      bait: true,
      live: true,
      report: true,
    },
  };

  function mkFeature(kind, label) {
    const b = document.createElement('button');
    b.className = `feature on`;
    b.dataset.kind = kind;
    b.innerHTML = `<span class="light"></span><span>${label}</span>`;
    b.onclick = () => {
      state.features[kind] = !state.features[kind];
      b.classList.toggle('on', state.features[kind]);
      if (kind === 'markers') {
        markerGrid.style.display = state.features[kind] ? 'grid' : 'none';
      }
    };
    return b;
  }

  const features = document.getElementById('features');
  [['clouds','Clouds'],['rain','Rain'],['jet','Jet balloons'],['popups','Popups'],['markers','Fish markers'],['bait','Bait layer'],['live','Live media'],['report','Reports']]
    .forEach(([k,l]) => features.appendChild(mkFeature(k,l)));

  async function json(url, opts) {
    const r = await fetch(url, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || `request failed (${r.status})`);
    return j;
  }

  function baitText(p) {
    const bait = (p.bait && p.bait.intensity) || 'unknown';
    return `Bait: ${bait}`;
  }

  async function loadHealth() {
    const j = await json('/gfs/api/health');
    document.getElementById('health').textContent = JSON.stringify(j, null, 2);
  }

  function renderMarkers() {
    markerGrid.innerHTML = '';
    state.fish.forEach((p) => {
      const node = markerTemplate.content.firstElementChild.cloneNode(true);
      const body = node.querySelector('.marker-content');
      node.querySelector('.marker-name').textContent = p.name;
      node.querySelector('.marker-coord').textContent = `${p.lat}, ${p.lon}`;
      node.querySelector('.marker-bait').textContent = baitText(p);
      body.addEventListener('click', () => openHud(p));
      markerGrid.appendChild(node);
    });
  }

  async function loadFish() {
    const j = await json('/gfs/api/fish');
    state.fish = j.items || [];
    renderMarkers();
  }

  function setHudMessage(msg) {
    mediaInfo.textContent = msg;
  }

  function renderVideos(uploads) {
    videoList.innerHTML = '';
    (uploads || []).forEach((u) => {
      const a = document.createElement('a');
      a.href = u.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = `${u.filename || 'video'} (${new Date(u.uploaded_at || Date.now()).toLocaleString()})`;
      videoList.appendChild(a);
    });
  }

  function renderIntel(j) {
    const bait = j.bait || {};
    const weather = j.weather || {};
    intel.textContent = [
      `Bait signal: ${bait.intensity || 'n/a'} (confidence ${bait.confidence ?? 'n/a'}%)`,
      `Bite window: ${bait.feeding_window || 'unknown'}`,
      `Weather: ${weather.summary || 'n/a'}`,
      `Water context: ${weather.water_context || 'n/a'}`,
    ].join('\n');
  }

  async function refreshLocationContext() {
    if (!state.selected) return;
    const j = await json(`/gfs/api/location_media?location_key=${encodeURIComponent(state.selected.location_key)}`);
    reportText.value = j.report_text || '';
    renderVideos(j.uploads || []);
    renderIntel(j);
    const live = j.live || { active: false, stream_url: '' };
    liveUrl.value = live.stream_url || '';
    setHudMessage(live.active ? `Live active: ${live.stream_url || '(no URL)'}` : 'Live inactive');
  }

  async function openHud(point) {
    if (!state.features.popups) return;
    state.selected = point;
    hudTitle.textContent = point.name;
    hudKey.textContent = `location_key: ${point.location_key}`;
    hud.classList.add('show');
    await refreshLocationContext();
  }

  async function saveReport() {
    if (!state.selected) return;
    await json('/gfs/api/report/upsert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location_key: state.selected.location_key, report_text: reportText.value || '' }),
    });
    await refreshLocationContext();
    setHudMessage('Report saved.');
  }

  async function uploadVideo() {
    if (!state.selected) return;
    const file = videoFile.files && videoFile.files[0];
    if (!file) {
      setHudMessage('Select a video file first.');
      return;
    }
    const fd = new FormData();
    fd.append('location_key', state.selected.location_key);
    fd.append('file', file);
    await json('/gfs/api/upload_video', { method: 'POST', body: fd });
    videoFile.value = '';
    await refreshLocationContext();
    setHudMessage('Video uploaded.');
  }

  async function connectLive() {
    if (!state.selected) return;
    const streamUrl = (liveUrl.value || '').trim();
    await json('/gfs/api/live/upsert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location_key: state.selected.location_key, active: true, stream_url: streamUrl }),
    });
    await refreshLocationContext();
    setHudMessage('Live session updated.');
  }

  function startLiveSocket() {
    const wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const ws = new WebSocket(`${wsProto}${location.host}/gfs/ws/updates`);
    const liveStatus = document.getElementById('liveStatus');
    ws.onopen = () => { liveStatus.textContent = 'Live updates: connected'; };
    ws.onmessage = (ev) => { liveStatus.textContent = `Live updates: ${ev.data}`; };
    ws.onerror = () => { liveStatus.textContent = 'Live updates: error'; };
    ws.onclose = () => {
      liveStatus.textContent = 'Live updates: reconnecting...';
      setTimeout(startLiveSocket, 1500);
    };
  }

  document.getElementById('saveReportBtn').addEventListener('click', () => saveReport().catch((e) => setHudMessage(e.message)));
  document.getElementById('uploadBtn').addEventListener('click', () => uploadVideo().catch((e) => setHudMessage(e.message)));
  document.getElementById('connectLiveBtn').addEventListener('click', () => connectLive().catch((e) => setHudMessage(e.message)));
  document.getElementById('closeHud').addEventListener('click', () => hud.classList.remove('show'));

  loadHealth().catch(() => {});
  loadFish().catch((e) => { markerGrid.textContent = e.message; });
  startLiveSocket();
})();
</script>
</body>
</html>
