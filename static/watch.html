<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Watch</title>
<style>
body{margin:0;background:#0f1320;color:#e8eefc;font-family:Arial,sans-serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.hud{padding:10px 12px;border-bottom:1px solid #263047;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{padding:4px 8px;border:1px solid #334161;border-radius:999px;background:#121a2c;font-size:12px}
.stage{padding:12px;height:100%;box-sizing:border-box}
.videoWrap{height:100%;border:1px solid #2a3550;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain}
#standby{opacity:.8}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <span class="badge" id="label">PUBLIC ACCESS</span>
    <span class="badge" id="mode">STANDBY</span>
    <span class="badge" id="conn">connecting</span>
        <span class="badge" id="ai">AI idle</span>
  </div>
  <div class="stage">
    <div class="videoWrap">
      <video id="v" autoplay playsinline controls></video>
      <div id="standby">Waiting for live stream or latest upload...</div>
    </div>
  </div>
</div>
<script src="/static/js/watch.js"></script>

</body>
</html>
