<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Watch</title>
<script src="/static/vendor/socket.io.js"></script>
<style>
body{margin:0;background:#0f1320;color:#e8eefc;font-family:Arial,sans-serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.hud{padding:10px 12px;border-bottom:1px solid #263047;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{padding:4px 8px;border:1px solid #334161;border-radius:999px;background:#121a2c;font-size:12px}
.stage{padding:12px;height:100%;box-sizing:border-box}
.videoWrap{height:100%;border:1px solid #2a3550;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain}
#standby{opacity:.8}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <span class="badge" id="label">PUBLIC ACCESS</span>
    <span class="badge" id="mode">STANDBY</span>
    <span class="badge" id="conn">connecting</span>
        <span class="badge" id="ai">AI idle</span>
  </div>
  <div class="stage">
    <div class="videoWrap">
      <video id="v" autoplay playsinline controls></video>
      <div id="standby">Waiting for live stream or latest upload...</div>
    </div>
  </div>
</div>
<script>
(() => {
  const room = (new URLSearchParams(location.search).get('room') || 'default').trim() || 'default';
  const socket = io(window.location.origin, { path: '/socket.io', transports: ['polling', 'websocket'], query: { room, role: 'watch' } });
  const v = document.getElementById('v');
  const standby = document.getElementById('standby');
  const conn = document.getElementById('conn');
  const mode = document.getElementById('mode');
  const ai = document.getElementById('ai');
  const label = document.getElementById('label');

  let pc = null;
  let iceRestarted = false;
  let makingAnswer = false;

  async function fetchIceServers() {
    try {
      const r = await fetch('/webrtc/ice-config');
      const j = await r.json();
      console.log('[watch] iceServers', j && j.iceServers);
      return (j && Array.isArray(j.iceServers)) ? j.iceServers : [{ urls: 'stun:stun.l.google.com:19302' }];
    } catch (e) {
      console.log('[watch] ice config failed', e);
      return [{ urls: 'stun:stun.l.google.com:19302' }];
    }
  }

  async function ensurePc(iceServers, forceNew = false) {
    if (pc && forceNew) { try { pc.close(); } catch (_) {} pc = null; }
    if (pc) return pc;
    pc = new RTCPeerConnection({ iceServers });
    pc.ontrack = (ev) => {
      v.srcObject = ev.streams[0];
      standby.style.display = 'none';
      mode.textContent = 'LIVE';
    };
    pc.onicecandidate = (e) => {
      if (e.candidate) socket.emit('watch_ice', { candidate: e.candidate });
    };
    pc.onconnectionstatechange = () => {
      console.log('[watch] pc.connectionState', pc.connectionState);
    };
    pc.oniceconnectionstatechange = async () => {
      console.log('[watch] pc.iceConnectionState', pc.iceConnectionState);
      if ((pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') && !iceRestarted) {
        iceRestarted = true;
        try {
          socket.emit('watch_join', { room });
        } catch (_) {}
      }
    };

    return pc;
  }

  socket.on('connect', () => { conn.textContent = 'connected'; console.log('[watch] socket connected'); socket.emit('watch_join', { room }); });
  socket.on('disconnect', () => { conn.textContent = 'disconnected'; console.log('[watch] socket disconnected'); });
  socket.on('reconnect_attempt', () => { conn.textContent = 'reconnecting'; console.log('[watch] socket reconnect_attempt'); });
  socket.on('reconnect_error', (e) => { conn.textContent = 'reconnect error'; console.log('[watch] socket reconnect_error', e); });

  socket.on('room_status', (p) => {
    if (!p) return;
    ai.textContent = p.ai && p.ai.enabled ? 'AI on' : 'AI off';
  });

  socket.on('stage_state', (p) => {
    if (!p) return;
    label.textContent = p.label || 'PUBLIC ACCESS';
    if (p.mode === 'upload' && p.latestUploadUrl) {
      v.srcObject = null;
      v.src = p.latestUploadUrl;
      v.muted = false;
      v.play().catch(() => {});
      standby.style.display = 'none';
      mode.textContent = 'LATEST UPLOAD';
    } else if (p.mode === 'none') {
      v.srcObject = null;
      v.removeAttribute('src');
      standby.style.display = 'block';
      mode.textContent = 'STANDBY';
    }
  });

  socket.on('watch_offer', async (offer) => {
    if (!offer || !offer.sdp) return;
    const iceServers = await fetchIceServers();
    const c = await ensurePc(iceServers, true);
    if (makingAnswer) return;
    makingAnswer = true;
    try {
      await c.setRemoteDescription(offer);
      const answer = await c.createAnswer();
      await c.setLocalDescription(answer);
      socket.emit('watch_answer', { sdp: c.localDescription.sdp, type: c.localDescription.type });
    } catch (e) {
      console.log('[watch] offer handling failed', e);
    } finally {
      makingAnswer = false;
    }
  });

  socket.on('webrtc_state', (p) => {
    if (!p) return;
    if (p.role === 'broadcaster' && p.state !== 'connected' && mode.textContent === 'LIVE') {
      mode.textContent = 'STANDBY';
      standby.style.display = 'block';
    }
  });
})();
</script>
</body>
</html>
